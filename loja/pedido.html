<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Acompanhar pedido — Quintal Rações</title>
<meta name="robots" content="noindex">
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="loja.css">
<link rel="icon" type="image/png" href="../assets/logo.png">
<style>
  .rt { max-width: 560px; margin: 0 auto; padding: 24px 16px 60px; }
  .rt__top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .rt__top img { height: 54px; width: auto; }
  .rt__card { background: #fff; border: 1px solid var(--c-gray-100); border-radius: var(--r-lg); padding: 22px; margin-bottom: 14px; }
  .rt__num { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--c-gray-600); }
  .rt__status { font-size: 26px; margin: 4px 0 6px; }
  .rt__desc { margin: 0; color: var(--c-gray-600); }
  .rt__tl { list-style: none; margin: 18px 0 0; padding: 0; display: grid; gap: 0; }
  .rt__tl li { position: relative; padding: 0 0 18px 30px; font-size: 14px; color: var(--c-gray-400); }
  .rt__tl li::before { content: ""; position: absolute; left: 6px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--c-gray-200); }
  .rt__tl li::after { content: ""; position: absolute; left: 11px; top: 18px; bottom: 0; width: 2px; background: var(--c-gray-100); }
  .rt__tl li:last-child::after { display: none; }
  .rt__tl li.is-on { color: var(--c-ink); font-weight: 600; }
  .rt__tl li.is-on::before { background: var(--c-mustard); box-shadow: 0 0 0 4px rgba(244,185,66,.25); }
  .rt__tl small { display: block; font-weight: 400; color: var(--c-gray-600); }
  .rt__itens { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 6px; font-size: 14px; }
  .rt__itens li { display: flex; justify-content: space-between; gap: 12px; }
  .rt__itens span:last-child { font-variant-numeric: tabular-nums; }
</style>
</head>
<body class="loja">
<main class="rt">
  <div class="rt__top">
    <a href="index.html"><img src="../assets/logo-transparente.png" alt="Quintal Rações e Pet Shop" width="81" height="54"></a>
    <a href="index.html" class="section__more">Voltar à loja</a>
  </div>
  <div id="app"><div class="lj-skel" style="height:280px"></div></div>
</main>
<div class="toast-lj" id="toast"></div>
<script type="module">
import { sb, brl, esc, STATUS, PAGTO } from './common.js';
const app = document.getElementById('app');
const token = new URLSearchParams(location.search).get('t');
const ORDEM = ['novo', 'confirmado', 'separando', 'pronto', 'em_rota', 'entregue'];
const hora = (d) => d ? new Date(d).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : '';

async function carregar() {
  if (!token) { app.innerHTML = '<div class="rt__card"><h2>Link inválido</h2><p class="rt__desc">Abra o link enviado após o pedido.</p></div>'; return; }
  const { data: p, error } = await sb.rpc('consultar_pedido', { p_token: token });
  if (error || !p) { app.innerHTML = '<div class="rt__card"><h2>Pedido não encontrado</h2><p class="rt__desc">Confira o link ou fale com a loja.</p></div>'; return; }
  const idx = ORDEM.indexOf(p.status);
  const etapas = p.modalidade === 'retirada' ? ORDEM.filter(s => s !== 'em_rota') : ORDEM;
  const quando = { novo: p.criado_em, confirmado: p.confirmado_em, em_rota: p.saiu_em, entregue: p.entregue_em };
  const st = STATUS[p.status];
  const titulo = p.modalidade === 'retirada' && p.status === 'pronto' ? 'Pronto para retirar' : st.t;
  app.innerHTML = `
    <section class="rt__card">
      <div class="rt__num">Pedido #${p.numero}</div>
      <h1 class="rt__status">${titulo}</h1>
      <p class="rt__desc">${p.status === 'em_rota' && p.entregador ? `${esc(p.entregador)} está a caminho${p.bairro ? ' do ' + esc(p.bairro) : ''}.` : st.d}</p>
      ${p.status === 'cancelado' ? '' : `<ol class="rt__tl">${etapas.map(s => `<li class="${ORDEM.indexOf(s) <= idx ? 'is-on' : ''}">
        ${p.modalidade === 'retirada' && s === 'entregue' ? 'Retirado' : STATUS[s].t}<small>${hora(quando[s])}</small></li>`).join('')}</ol>`}
    </section>
    <section class="rt__card">
      <ul class="rt__itens">${p.itens.map(i => `<li><span>${+i.quantidade} × ${esc(i.nome)}</span><span>${brl(i.total)}</span></li>`).join('')}</ul>
      <div class="lj-resumo">
        <div><span>Produtos</span><span>${brl(p.subtotal)}</span></div>
        <div><span>${p.modalidade === 'retirada' ? 'Retirada' : 'Entrega'}</span><span>${p.frete > 0 ? brl(p.frete) : 'Grátis'}</span></div>
        <div class="lj-resumo__total"><span>Total</span><strong>${brl(p.total)}</strong></div>
        <div><span>Pagamento</span><span>${PAGTO[p.pagamento_forma]} · ${p.pagamento_status === 'pendente' ? 'pendente' : 'confirmado'}</span></div>
      </div>
    </section>
    <a class="lj-btn lj-btn--block lj-btn--whats" target="_blank" rel="noopener" href="https://wa.me/5567999638298?text=${encodeURIComponent('Olá! Sobre o pedido #' + p.numero)}">Falar com a loja</a>`;
  if (!['entregue', 'cancelado'].includes(p.status)) setTimeout(carregar, 20000);
}
carregar();
</script>
</body>
</html>
