<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Entregas — Quintal Rações</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1A1A1A">
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../loja/loja.css">
<style>
  body { background: #F1EDE3; }
  .en-top { background: var(--c-ink); color: #fff; padding: 16px 16px 18px; position: sticky; top: 0; z-index: 5; }
  .en-top small { color: var(--c-mustard); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 11px; }
  .en-top h1 { font-size: 22px; color: #fff; margin-top: 2px; }
  .en-top .en-kpis { display: flex; gap: 8px; margin-top: 12px; }
  .en-top .en-kpis span { flex: 1; background: rgba(255,255,255,.08); border-radius: 10px; padding: 8px 10px; font-size: 12px; color: #D8D2C2; }
  .en-top .en-kpis strong { display: block; color: #fff; font-size: 18px; font-family: var(--ff-display); }
  .en { max-width: 560px; margin: 0 auto; padding: 14px 12px 40px; display: grid; gap: 12px; }
  .en-card { background: #fff; border-radius: 14px; padding: 16px; box-shadow: var(--sh-1); }
  .en-card.is-done { opacity: .6; }
  .en-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .en-head strong { font-family: var(--ff-display); font-size: 18px; }
  .en-tag { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 4px 9px; border-radius: 999px; background: var(--c-cream-2); }
  .en-tag--rota { background: var(--c-mustard); }
  .en-tag--ok { background: var(--c-success-bg); color: var(--c-success); }
  .en-end { font-size: 16px; font-weight: 600; margin: 8px 0 2px; }
  .en-sub { font-size: 13px; color: var(--c-gray-600); margin: 0; }
  .en-itens { margin: 10px 0; padding: 10px 12px; background: var(--c-gray-50); border-radius: 8px; font-size: 13.5px; }
  .en-cobrar { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-radius: 8px; background: #FFF4DC; font-size: 14px; margin-bottom: 10px; }
  .en-cobrar strong { font-size: 18px; font-family: var(--ff-display); }
  .en-pago { background: var(--c-success-bg); }
  .en-acoes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .en-acoes .lj-btn { margin: 0; }
  .en-full { grid-column: 1 / -1; }
  .en-check { display: flex; gap: 10px; align-items: center; font-size: 14px; font-weight: 600; margin: 4px 0 10px; }
  .en-check input { width: 22px; height: 22px; accent-color: var(--c-ink); }
</style>
</head>
<body>
<header class="en-top" id="top"><small>Quintal Rações · Entregas</small><h1>Carregando…</h1></header>
<main class="en" id="app"></main>
<div class="toast-lj" id="toast"></div>
<script type="module">
import { sb, brl, esc, PAGTO, toast } from '../loja/common.js';
const LOJA = 'R. Corumbá, 180 - Espatódia, Chapadão do Sul - MS';
const token = new URLSearchParams(location.search).get('t');
const top = document.getElementById('top'), app = document.getElementById('app');
const mapa = (p) => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${p.endereco}, ${p.bairro || ''}, Chapadão do Sul - MS`)}`;
const cobrar = (p) => ['pix_entrega', 'cartao_entrega', 'dinheiro'].includes(p.pagamento_forma) && p.pagamento_status === 'pendente';

async function carregar() {
  if (!token) { top.querySelector('h1').textContent = 'Link inválido'; return; }
  const { data, error } = await sb.rpc('entregador_painel', { p_token: token });
  if (error || !data) { top.querySelector('h1').textContent = 'Link inválido ou desativado'; app.innerHTML = '<p class="en-sub">Peça um novo link para a loja.</p>'; return; }
  const ped = data.pedidos;
  const abertos = ped.filter(p => p.status !== 'entregue');
  const ganho = ped.filter(p => p.status === 'entregue').reduce((s, p) => s + +(p.custo_entrega || 0), 0);
  top.innerHTML = `<small>Quintal Rações · Entregas</small><h1>Olá, ${esc(data.parceiro.nome.split(' ')[0])}</h1>
    <div class="en-kpis"><span><strong>${abertos.length}</strong>para entregar</span>
    <span><strong>${ped.length - abertos.length}</strong>entregues hoje</span>
    <span><strong>${brl(ganho)}</strong>a receber</span></div>`;
  const rota = abertos.length > 1
    ? `<a class="lj-btn lj-btn--go" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(LOJA)}&destination=${encodeURIComponent(`${abertos.at(-1).endereco}, ${abertos.at(-1).bairro}, Chapadão do Sul - MS`)}&waypoints=${encodeURIComponent(abertos.slice(0, -1).map(p => `${p.endereco}, ${p.bairro}, Chapadão do Sul - MS`).join('|'))}&travelmode=driving">Abrir rota com ${abertos.length} paradas</a>` : '';
  app.innerHTML = (ped.length ? '' : '<div class="en-card"><strong>Nenhuma entrega no momento.</strong><p class="en-sub">Esta tela atualiza sozinha.</p></div>') + rota + ped.map(p => `
    <article class="en-card ${p.status === 'entregue' ? 'is-done' : ''}">
      <div class="en-head"><strong>#${p.numero}</strong>
        <span class="en-tag ${p.status === 'em_rota' ? 'en-tag--rota' : p.status === 'entregue' ? 'en-tag--ok' : ''}">${p.status === 'pronto' ? 'Retirar na loja' : p.status === 'em_rota' ? 'Em rota' : 'Entregue'}</span></div>
      <p class="en-end">${esc(p.endereco)}</p>
      <p class="en-sub">${esc(p.bairro || '')}${p.complemento ? ' · ' + esc(p.complemento) : ''}${p.referencia ? ' · Ref.: ' + esc(p.referencia) : ''}</p>
      <p class="en-sub">${esc(p.cliente)}</p>
      <div class="en-itens">${p.itens.map(esc).join('<br>')}</div>
      ${cobrar(p) ? `<div class="en-cobrar"><span>Cobrar · ${PAGTO[p.pagamento_forma]}${p.troco_para ? `<br><small>Troco para ${brl(p.troco_para)} → levar ${brl(p.troco_para - p.total)}</small>` : ''}</span><strong>${brl(p.total)}</strong></div>`
        : p.pagamento_status === 'pendente' ? `<div class="en-cobrar"><span>${PAGTO[p.pagamento_forma]} · aguardando confirmação da loja</span><strong>Não cobrar</strong></div>`
        : `<div class="en-cobrar en-pago"><span>Pagamento</span><strong>Já pago</strong></div>`}
      ${p.status === 'entregue' ? '' : `<div class="en-acoes">
        <a class="lj-btn lj-btn--ghost" target="_blank" rel="noopener" href="${mapa(p)}">Mapa</a>
        <a class="lj-btn lj-btn--ghost" target="_blank" rel="noopener" href="https://wa.me/55${p.telefone.replace(/^55/, '')}?text=${encodeURIComponent(`Olá! Sou o entregador do Quintal Rações, estou levando o pedido #${p.numero}.`)}">WhatsApp</a>
        ${p.status === 'pronto' ? `<button class="lj-btn lj-btn--go en-full" data-st="em_rota" data-id="${p.id}">Peguei o pedido · sair para entrega</button>` : `
          ${cobrar(p) ? `<label class="en-check en-full"><input type="checkbox" id="rec-${p.id}"> Recebi ${brl(p.total)} do cliente</label>` : ''}
          <button class="lj-btn en-full" data-st="entregue" data-id="${p.id}" data-cobrar="${cobrar(p) ? 1 : ''}">Confirmar entrega</button>`}
      </div>`}
    </article>`).join('');
}
app.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-st]'); if (!b) return;
  const id = +b.dataset.id;
  const recebido = !!document.getElementById(`rec-${id}`)?.checked;
  if (b.dataset.cobrar && !recebido && !confirm('Você não marcou que recebeu o pagamento. Confirmar entrega mesmo assim?')) return;
  b.disabled = true;
  const { error } = await sb.rpc('entregador_atualizar', { p_token: token, p_pedido: id, p_status: b.dataset.st, p_recebido: recebido, p_obs: null });
  if (error) { b.disabled = false; return toast(error.message, 'erro'); }
  toast(b.dataset.st === 'entregue' ? 'Entrega confirmada' : 'Boa entrega');
  carregar();
});
carregar();
setInterval(carregar, 30000);
</script>
</body>
</html>
